plugins {
    id 'com.android.application' version '8.10.1'
}

android {
    namespace 'info.cosmonet.cosmocoding'
    compileSdk 35

    defaultConfig {
        applicationId 'info.cosmonet.cosmocoding'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.1.4'
    }

    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir('generated/workspace/assets')
            res.srcDir layout.buildDirectory.dir('generated/workspace/res')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
